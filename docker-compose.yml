services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: hft-postgres
    environment:
      - POSTGRES_USER=trading_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
      - POSTGRES_DB=trading_db
    ports:
      - "5432:5432"
    networks:
      - hft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # C++ HFT Trading Engine - builds from ml-trading-app-cpp
  hft-engine:
    build:
      context: ../ml-trading-app-cpp
      dockerfile: Dockerfile.prod
    container_name: hft-engine
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=INFO
    networks:
      - hft-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/50051;
          echo -e 'GET / HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n' >&3;
          exec 3>&-
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./logs/engine:/var/log/trading

  # Go API server - in-memory ledger + write-behind outbox to Postgres.
  # Builds from ../ml-trading-app-go (matches the engine layout). To use the
  # published release, replace `build:` with
  # `image: ghcr.io/t-py-t/ml-trading-app-go-server:v0.1.0`.
  hft-backend:
    build:
      context: ../ml-trading-app-go
      dockerfile: Dockerfile.server
    container_name: hft-backend
    ports:
      - "8000:8000"
    environment:
      - HTTP_ADDR=:8000
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the environment or .env}
      - ENGINE_ENABLED=true
      - ENGINE_ADDR=hft-engine:50051
      - WRITE_BEHIND=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - APP_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment or .env}
    depends_on:
      postgres:
        condition: service_healthy
      hft-engine:
        condition: service_healthy
    networks:
      - hft-network
    restart: unless-stopped
    healthcheck:
      # /healthz returns 200 ok under normal load and 503 degraded when
      # the outbox is over half capacity or stale. Either is "service is
      # responding"; we only fail the check if the endpoint is unreachable.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

# The Go TUI is interactive (Bubble Tea needs a TTY) so it isn't part of
# the long-running compose stack. Run it directly:
#
#   docker run --rm -it \
#     -e ML_TRADING_API_BASE=http://host.docker.internal:8000 \
#     ghcr.io/t-py-t/ml-trading-app-go-tui:latest
#
# …or use a native binary from the ml-trading-app-go releases page.

networks:
  hft-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

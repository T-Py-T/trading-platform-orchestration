name: Test Suite

'on':
  push:
    branches: [main]
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --config .pre-commit/.pre-commit-config.yaml

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install kustomize
        run: |
          KUSTOMIZE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz"
          curl -fsSL "$KUSTOMIZE_URL" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Validate Compose file
        run: |
          docker compose --env-file tests/fixtures/compose-ci.env \
            -f docker-compose.yml config --quiet
      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

name: Security Audit

'on':
  push:
    branches: [main]
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          python -m pip_audit -r requirements.txt

  trivy-images:
    name: Trivy container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.75.0
      - name: Scan digest-pinned images from manifests
        run: |
          mapfile -t images < <(python3 scripts/list_digest_pinned_images.py)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No digest-pinned images found in manifests" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            echo "Scanning ${image}"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --scanners vuln "${image}"
          done

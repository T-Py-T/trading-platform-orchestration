# k8s/base/kustomization.yaml
# Base Kustomization - Core manifests for HFT Trading Platform

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Metadata
metadata:
  name: hft-trading-base
  namespace: hft-trading

# Resources — Redis is gone with the Python backend; the Go backend's
# in-memory ledger + write-behind outbox replaces the Python+Redis
# fire-and-forget queue.
resources:
  - namespace.yaml
  - postgres.yaml
  - hft-engine.yaml
  - hft-backend.yaml
  - nginx-ingress.yaml

# Common labels applied to all resources and workload selectors
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: hft-trading
      app.kubernetes.io/part-of: hft-trading-platform
      app.kubernetes.io/version: "1.0.0"

# Common annotations applied to all resources
commonAnnotations:
  app.kubernetes.io/managed-by: kustomize
  documentation: "https://github.com/T-Py-T/trading-platform-orchestration"

# Namespace
namespace: hft-trading

# Images
images:
  - name: hft-engine
    newName: hft-trading-app-hft-engine
    # Source revision 2a722ff26edab7ce8d44f7cdfd83abebd586d98c.
    newTag: 2a722ff
  - name: ghcr.io/t-py-t/ml-trading-app-go-server
    newTag: v0.1.0

# ConfigMap Generator (for future use)
configMapGenerator:
  - name: hft-config
    literals:
      - PLATFORM_VERSION="1.0.0"
      - LOG_FORMAT="json"

# Replicas
replicas:
  - name: hft-backend
    count: 2
  - name: hft-engine
    count: 1
  - name: postgres
    count: 1

# Patches can be applied here for base-level modifications if needed

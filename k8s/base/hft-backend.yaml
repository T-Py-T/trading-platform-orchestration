# hft-trading-app/k8s/base/hft-backend.yaml
# Go API server (chi + pgx) — in-memory ledger + write-behind outbox to
# Postgres. Image is built and published from ml-trading-app-go on every
# v* tag. See https://github.com/T-Py-T/ml-trading-app-go.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hft-trading
data:
  HTTP_ADDR: ":8000"
  ENGINE_ADDR: "hft-engine:50051"
  ENGINE_ENABLED: "true"
  WRITE_BEHIND: "true"
  OUTBOX_BUFFER: "10000"
  OUTBOX_BATCH: "50"
  OUTBOX_FLUSH: "50ms"
  OUTBOX_LAG_THRESHOLD: "5s"
  LOG_LEVEL: "debug"
  LOG_FORMAT: "json"
  APP_ENV: "development"

---
apiVersion: v1
kind: Service
metadata:
  name: hft-backend
  namespace: hft-trading
  labels:
    app: hft-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: hft-backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hft-backend
  namespace: hft-trading
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hft-backend
  template:
    metadata:
      labels:
        app: hft-backend
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hft-backend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: hft-backend
        image: ghcr.io/t-py-t/ml-trading-app-go-server:v0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
            ephemeral-storage: "128Mi"
          limits:
            memory: "256Mi"
            cpu: "500m"
            ephemeral-storage: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10

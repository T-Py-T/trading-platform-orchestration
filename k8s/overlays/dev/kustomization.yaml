# k8s/overlays/dev/kustomization.yaml
# Development Environment Overlay

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Environment label
labels:
  - includeSelectors: true
    pairs:
      environment: development

# Configuration for development
configMapGenerator:
  - name: hft-config
    behavior: merge
    literals:
      - ENVIRONMENT="development"
      - LOG_LEVEL="debug"
      - APP_ENV="development"

# Development replicas (fewer resources)
replicas:
  - name: hft-backend
    count: 1
  - name: postgres
    count: 1

# Development images (local or development tags)
# Match post-base image name (base images.newName renames hft-engine).
images:
  - name: hft-trading-app-hft-engine
    newTag: dev
  - name: ghcr.io/t-py-t/ml-trading-app-go-server
    newTag: v0.1.0

# Resource constraints for development
patches:
  - target:
      kind: Deployment
      name: hft-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  - target:
      kind: Deployment
      name: hft-engine
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  - target:
      kind: Deployment
      name: hft-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"

  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"

  - target:
      kind: Deployment
      name: hft-engine
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
